name: GitHub Daily Radar

on:
  schedule:
    # Run automatically every day at 00:00 UTC (7:00 AM VN time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "radar-workflow"
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run GitHub Daily Radar
        run: |
          python main.py --no-open

      - name: 💾 Commit & Push updated reports to GitHub
        run: |
          git config --global user.name "GitHub Daily Radar Bot"
          git config --global user.email "radar-bot@users.noreply.github.com"
          git add reports/ cache_radar.json cache_velocity.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto Update: GitHub Daily Radar [$(date +'%Y-%m-%d')]" && git push)

      - name: 🌐 Setup GitHub Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 📦 Upload artifact for GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy Web Dashboard to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
